http:
  service_name: "product_service"
  mode: "staging"
  addr: ":8080"
  read_timeout: 5s
  write_timeout: 10s
  idle_timeout: 60s
  shutdown_timeout: 5s

grpc:
  server: ":8081"
  dynamic_pricing: "localhost:8084"

log:
  level: info
  format: console
  stdout: true
  path: logs/app.log

postgres:
  dsn: "host=localhost port=5432 user=postgres password=postgres dbname=product_service sslmode=disable"
  migration_url: "postgresql://postgres:postgres@localhost:5432/product_service?sslmode=disable"
  max_conns: 40
  min_conns: 10
  max_conn_lifetime: 15m
  max_conn_idle_time: 2m

redis:
  addr: "localhost:6379"
  password: "redis123"
  db: 0
  pool_size: 50
  min_idle_conns: 10
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m

jwt:
  secret: "development-shared-jwt-secret-change-in-production"
  issuer: "auth-service"
  redis_db: 3

minio:
  endpoint: "localhost:9000"
  access_key_id: "minioadmin"
  secret_access_key: "minioadmin"
  bucket_name: "products"
  use_ssl: false
