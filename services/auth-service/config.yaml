http:
  service_name: "auth-service"
  mode: "development"
  addr: ":8085"
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 120s
  shutdown_timeout: 5s

log:
  level: info
  format: console
  stdout: true
  path: logs/app.log

postgres:
  dsn: "host=localhost port=5432 user=postgres password=postgres dbname=auth_service sslmode=disable"
  max_conns: 10
  min_conns: 2
  max_conn_lifetime: 1h
  max_conn_idle_time: 10m

redis:
  addr: "localhost:6379"
  password: "redis123"
  db: 3
  pool_size: 10
  min_idle_conns: 2

jwt:
  issuer: "auth-service"
  secret: "development-shared-jwt-secret-change-in-production"
  access_ttl: 15m
  refresh_ttl: 168h
  cookie_secure: false
