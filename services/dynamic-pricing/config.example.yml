http:
  service_name: "dynamic-pricing-service"
  mode: "development"
  addr: ":8083"
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 120s
  shutdown_timeout: 5s

grpc:
  server: ":8084"

log:
  level: info
  format: console
  stdout: true
  path: logs/app.log

postgres:
  dsn: "host=localhost port=5432 user=postgres password=your_password dbname=dynamic_pricing sslmode=disable"
  migration_url: "postgresql://postgres:your_password@localhost:5432/dynamic_pricing?sslmode=disable"
  max_conns: 10
  min_conns: 2
  max_conn_lifetime: 1h
  max_conn_idle_time: 30m

redis:
  addr: "localhost:6379"
  password: "your_redis_password"
  db: 1
  pool_size: 10
  min_idle_conns: 5
  max_conn_lifetime: 1h
  max_conn_idle_time: 30m

jwt:
  # Required. Set JWT_SECRET in the environment or config.yaml (ignored by Git).
  secret: ""
  issuer: "auth-service"
  redis_db: 3

rbac:
  policy_reload_interval: 5s

kafka:
  brokers:
    - "localhost:9092"
  group_id: "dynamic-pricing-service"
  casbin_topic: "rbac-policies"
