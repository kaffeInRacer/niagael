http:
  service_name: "dynamic-pricing-service"
  mode: "development"
  addr: ":8083"
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 120s
  shutdown_timeout: 5s

grpc:
  server: ":8084"

log:
  level: info
  format: console
  stdout: true
  path: logs/app.log

postgres:
  dsn: "host=localhost port=5432 user=postgres password=postgres dbname=dynamic_pricing sslmode=disable"
  migration_url: "postgresql://postgres:postgres@localhost:5432/dynamic_pricing?sslmode=disable"
  max_conns: 10
  min_conns: 2
  max_conn_lifetime: 1h
  max_conn_idle_time: 30m

redis:
  addr: "localhost:6379"
  password: "redis123"
  db: 1
  pool_size: 10
  min_idle_conns: 5
  max_conn_lifetime: 1h
  max_conn_idle_time: 30m

jwt:
  secret: "development-shared-jwt-secret-change-in-production"
  issuer: "auth-service"
  redis_db: 3
